[project]
name = "cablegram-mcp"
version = "0.1.1"
description = "Raw dispatches from 19 tech, AI and Chinese/Russian sources. Date-filtered only, never ranked."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Levon Gabrielyan" }]
keywords = ["mcp", "model-context-protocol", "rss", "news", "ai", "tech-signals"]

dependencies = [
    "mcp>=2.1.1",
]

[project.scripts]
cablegram = "cablegram.cli:main"
# The same entry point under the package's own name, so `uvx cablegram-mcp`
# works. Without it uvx refuses — the package is cablegram-mcp and the command
# was only cablegram — and the fix it suggests, `uvx --from cablegram-mcp
# cablegram`, is the first thing anyone would have to type.
cablegram-mcp = "cablegram.cli:main"

[project.urls]
Homepage = "https://github.com/levongabrielyan/cablegram-mcp"
Repository = "https://github.com/levongabrielyan/cablegram-mcp"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cablegram"]
