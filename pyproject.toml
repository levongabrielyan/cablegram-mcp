[project]
name = "cablegram-mcp"
version = "0.2.3"
description = "An MCP server that reads twenty-nine AI and tech sources in English, Chinese and Russian, so a model knows what changed after its training cutoff."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Levon Gabrielyan" }]
keywords = ["mcp", "model-context-protocol", "rss", "news", "ai", "tech-signals"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
    "mcp>=2.1.1",
]

[project.scripts]
cablegram = "cablegram.cli:main"
# The same entry point under the package's own name, so `uvx cablegram-mcp`
# works. Without it uvx refuses — the package is cablegram-mcp and the command
# was only cablegram — and the fix it suggests, `uvx --from cablegram-mcp
# cablegram`, is the first thing anyone would have to type.
cablegram-mcp = "cablegram.cli:main"

[project.urls]
Homepage = "https://github.com/levongabrielyan/cablegram-mcp"
Repository = "https://github.com/levongabrielyan/cablegram-mcp"
Issues = "https://github.com/levongabrielyan/cablegram-mcp/issues"
Documentation = "https://github.com/levongabrielyan/cablegram-mcp/blob/main/docs/design.md"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cablegram"]
