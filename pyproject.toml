[project]
name = "cablegram-mcp"
version = "0.1.0"
description = "Raw dispatches from 15 tech, AI and Chinese/Russian sources. Date-filtered only, never ranked."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Levon Gabrielyan" }]
keywords = ["mcp", "model-context-protocol", "rss", "news", "ai", "tech-signals"]

dependencies = [
    "mcp>=2.1.1",
]

[project.scripts]
cablegram = "cablegram.server:main"

[project.urls]
Homepage = "https://github.com/levongabrielyan/cablegram-mcp"
Repository = "https://github.com/levongabrielyan/cablegram-mcp"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cablegram"]
